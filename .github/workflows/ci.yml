name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
        compiler: [ gcc, clang ]
        build_type: [ Release, Debug ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            valgrind \
            doxygen \
            graphviz

      - name: Configure compiler environment
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          elif [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON \
            -DBUILD_DEMOS=ON \
            -DBUILD_DOCS=ON

      - name: Build targets
        run: |
          cmake --build build --config ${{ matrix.build_type }} --parallel $(nproc)

      - name: Execute test suite (CTest)
        run: |
          ctest --test-dir build --output-on-failure --schedule-random

      - name: Memory leak analysis (Valgrind)
        if: matrix.build_type == 'Debug' && matrix.compiler == 'gcc'
        run: |
          valgrind --leak-check=full --error-exitcode=1 ./build/test/test_vecteur
          valgrind --leak-check=full --error-exitcode=1 ./build/test/test_particule
          valgrind --leak-check=full --error-exitcode=1 ./build/test/test_boundary
          valgrind --leak-check=full --error-exitcode=1 ./build/test/test_univers

      - name: Verify Doxygen documentation build
        run: |
          cmake --build build --target doc
